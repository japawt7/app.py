<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japa Pro I.A. - Estatísticas</title>
<style>
:root{--bg:#000;--card:#0c0c0c;--ink:#fff;--mut:#a3a3a3;--line:#2a2a2a;--g:#fff;--live:#e5262f;--cy:#fff;--rs:#e5262f;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:3px double var(--live);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
h1{font:700 19px var(--serif);margin:0;display:flex;align-items:center;gap:10px;letter-spacing:.02em;text-transform:uppercase;color:var(--g)}
h1 span{font-weight:400;color:var(--mut)}
.logo{font:700 13px var(--serif);font-style:normal;background:var(--live);color:#fff;width:30px;height:30px;display:grid;place-items:center;border-radius:3px;letter-spacing:0}
#status{text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--g)}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.sp{flex:1}
button,select{font:inherit;font-size:12px;border-radius:3px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--g)}
button.on{background:var(--g);color:var(--bg);font-weight:700;border-color:var(--g)}
h2{font:700 17px var(--serif);margin:26px 0 4px;text-transform:capitalize;border-bottom:2px solid var(--ink);padding-bottom:6px}
h3{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;color:var(--g);margin:16px 0 6px;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:5px}
img{object-fit:contain}.lg{width:16px;height:16px}.cr{width:24px;height:24px;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;margin-bottom:6px;overflow:hidden}
.row{width:100%;min-width:0;display:grid;grid-template-columns:150px 1fr 76px 1fr;align-items:center;gap:8px;padding:11px 12px;border:0;border-radius:0;background:none;text-align:left;color:var(--ink);font-size:13px}
.row:hover{background:#161616}
.t{color:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
.tm{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600}
.tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm.r{justify-content:flex-end;text-align:right}
.x{color:var(--mut);text-align:center;white-space:nowrap}
.x b{font:700 20px var(--serif);color:var(--ink);font-variant-numeric:tabular-nums}
.vm{color:var(--live)!important;font-weight:700;letter-spacing:.04em}
.t .vm::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:6px;vertical-align:middle}
.pn{border-top:1px solid var(--line);padding:14px;background:#080808}
.ms{text-align:center;color:var(--mut);padding:18px;font-size:12px}
.cab{display:flex;justify-content:space-between;font:700 13px var(--serif);margin:10px 0 4px}
.g{font-size:10px;letter-spacing:.12em;color:var(--live);margin:14px 0 2px;border-bottom:1px solid var(--line);padding-bottom:3px}
.ln{display:grid;grid-template-columns:44px 1fr 130px 1fr 44px;align-items:center;gap:8px;padding:4px 0;font-size:12px}
.ln b:last-child{text-align:right}.ln .c{text-align:center;color:var(--ink)}
.bk{height:6px;background:#1f1f1f;border-radius:2px;display:flex}
.bk.l{justify-content:flex-end}.bk i{display:block;height:100%;border-radius:2px}
@media(max-width:560px){
  .wrap{padding:12px}
  .row{grid-template-columns:1fr 64px 1fr;gap:6px;padding:10px}
  .row .t{grid-column:1/-1}
  .tm{font-size:12px;gap:6px}.x b{font-size:18px}
  .ln{grid-template-columns:34px 1fr 90px 1fr 34px}
}
.hl{height:42px;width:auto;flex:none}
#intro{position:fixed;inset:0;z-index:99;background:#000;display:grid;place-items:center;cursor:pointer;transition:opacity .6s ease,visibility .6s}
#intro.off{opacity:0;visibility:hidden}
#intro .in{text-align:center;color:#fff}
#intro .big{width:min(82vw,520px);height:auto;animation:pop .9s cubic-bezier(.2,.8,.2,1) both}
#intro .rl{height:2px;background:var(--live);width:0;margin:16px auto 0;animation:ln .8s .9s forwards}
@keyframes pop{from{opacity:0;transform:scale(.7) rotate(-6deg)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ln{to{width:min(60vw,320px)}}
@media(prefers-reduced-motion:reduce){#intro *{animation:none!important}#intro .rl{width:min(60vw,320px)}}
</style>
</head>

<div class="wrap">
  <div class="bar">
    <button class="per" data-p="today">Hoje</button>
    <button class="per" data-p="tomorrow">Amanhã</button>
    <button class="per" data-p="week">Esta semana</button>
    <span class="sp"></span>
    <select id="liga"></select>
  </div>
  <div id="lista"></div>

<script>
// Endereço do seu servidor (nenhuma chave aqui)
(function(){const i=document.getElementById("intro");let vista=false;
  try{vista=sessionStorage.getItem("jp_intro")==="1";}catch(_){}
  if(vista){i.remove();return;}
  const fim=()=>{i.classList.add("off");setTimeout(()=>i.remove(),700);try{sessionStorage.setItem("jp_intro","1");}catch(_){}};
  i.onclick=fim;setTimeout(fim,2800);
})();
// Endereço do seu servidor na Vercel (24h)
const API = "https://app-py-opal.vercel.app/api";

const LIGAS=[[71,"Brasileirão Série A"],[72,"Brasileirão Série B"],[75,"Brasileirão Série C"],[76,"Brasileirão Série D"],
[140,"La Liga"],[141,"La Liga 2"],[78,"Bundesliga"],[79,"2. Bundesliga"],[39,"Premier League"],[40,"Championship"],
[135,"Serie A (Itália)"],[136,"Serie B (Itália)"],[61,"Ligue 1"],[62,"Ligue 2"],[94,"Primeira Liga"],[95,"Liga Portugal 2"],
[13,"Libertadores"],[11,"Sul-Americana"],[2,"Champions League"],[3,"Europa League"]];
const ORDEM=new Map(LIGAS.map(([id],i)=>[id,i]));
const GRUPOS=[
["Ataque",[
  ["Gols","goals"],
  ["Finalizações","shots"],
  ["Chutes a gol","sot"],
  ["Escanteios","corners"],
  ["Impedimentos","offsides"],
  ["Bolas na trave","woodwork"]
]],
["Defesa",[
  ["Gols sofridos","opp_goals"],
  ["Finalizações sofridas","opp_shots"],
  ["Escanteios cedidos","opp_corners"],
  ["Defesas do goleiro","saves"],
  ["Desarmes","tackles"]
]],
["Disciplina",[
  ["Faltas","fouls"],
  ["Cartões amarelos","yellow"],
  ["Cartões vermelhos","red"]
]],
["Controle",[
  ["Posse de bola (%)","possession"]
]]];

const MEDIDAS={mean:"Média",median:"Mediana",mode:"Moda"};
let aviso="",periodo="today",escopo="split",medida="mean",jogos=[],porId=new Map();
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmt=v=>v==null?"—":(Number.isInteger(v)?v:v.toFixed(1).replace(".",","));
const escudo=t=>`<img class="cr" loading="lazy" src="${esc(t.logo)}" alt="" onerror="this.style.visibility='hidden'">`;
const tm=(t,r)=>`<span class="tm${r?" r":""}">${r?"":escudo(t)}<span>${esc(t.name)}</span>${r?escudo(t):""}</span>`;

$("#liga").innerHTML='<option value="">Todas as ligas (mundo todo)</option><option value="top">Só as 20 principais</option>'+
  LIGAS.map(([id,n])=>`<option value="${id}">${esc(n)}</option>`).join("");

function intervalo(p){const a=new Date(),b=new Date();
  if(p==="tomorrow"){a.setDate(a.getDate()+1);b.setDate(b.getDate()+1);}
  if(p==="week")b.setDate(b.getDate()+6);
  return [iso(a),iso(b)];}
function marcar(){
  document.querySelectorAll(".per").forEach(b=>b.classList.toggle("on",b.dataset.p===periodo));
  document.querySelectorAll(".esc").forEach(b=>b.classList.toggle("on",b.dataset.e===escopo));}

async function carregar(){
  if(API.startsWith("COLE_AQUI")){$("#lista").innerHTML='<div class="ms">Edite o index.html e coloque o endereço da sua API na constante API.</div>';return;}
  marcar();$("#status").textContent="Carregando…";$("#lista").innerHTML='<div class="ms">Buscando jogos…</div>';
  const [s,e]=intervalo(periodo);
  try{
    const r=await fetch(`${API}/fixtures?start=${s}&end=${e}`),j=await r.json();
    if(!r.ok)throw new Error(j.error||"Erro ao buscar jogos");
    jogos=j.data||[];aviso=(j.avisos&&j.avisos.length)?"Alguns dias não carregaram: "+j.avisos[0]:"";porId=new Map(jogos.map(g=>[g.id,g]));
    estado=new Map(jogos.map(g=>[g.id,{status:g.status,elapsed:g.elapsed,goals:g.goals||{},t0:Date.now(),fim:FINAIS.has(g.status)?g.ts*1000+110*60000:null}]));
    $("#status").textContent=`${jogos.length} jogos`;desenhar();pollLive();
  }catch(err){$("#status").textContent="Erro";$("#lista").innerHTML=`<div class="ms">${esc(err.message)}</div>`;}
}

function cardHtml(g){
  const t=new Date(g.date).toLocaleString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  g._t=t;const [a,b]=linha(g);
  return `<div class="card" data-id="${g.id}"><button class="row"><span class="t">${a}</span>${tm(g.home)}<span class="x">${b}</span>${tm(g.away,1)}</button><div class="pn" hidden></div></div>`;
}

function desenhar(){
  marcar();
  const f=$("#liga").value;
  const l=jogos.filter(g=>f===""||(f==="top"?ORDEM.has(g.league.id):g.league.id==f));
  if(!l.length){$("#lista").innerHTML='<div class="ms">Nenhum jogo encontrado para este filtro.</div>';return;}
  const dias={};
  l.forEach(g=>{((dias[g.date.slice(0,10)]??={})[g.league.id]??={liga:g.league,jogos:[]}).jogos.push(g);});
  let h="";
  Object.keys(dias).sort().forEach(d=>{
    h+=`<h2>${esc(new Date(d+"T12:00").toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit"}))}</h2>`;
    Object.values(dias[d]).sort((a,b)=>(ORDEM.get(a.liga.id)??99)-(ORDEM.get(b.liga.id)??99)||
      String(a.liga.country).localeCompare(String(b.liga.country))||a.liga.name.localeCompare(b.liga.name)).forEach(gr=>{
      h+=`<h3><img class="lg" loading="lazy" src="${esc(gr.liga.logo)}" alt="">${esc(gr.liga.country||"")} · ${esc(gr.liga.name)}</h3>`;
      gr.jogos.sort((a,b)=>a.date.localeCompare(b.date)).forEach(g=>{h+=cardHtml(g);});
    });
  });
  $("#lista").innerHTML=(aviso?`<div class="ms">${esc(aviso)}</div>`:"")+h;
}

async function buscar(id,v){
  let r;
  try{r=await fetch(`${API}/team/${id}/stats?venue=${v}`);}
  catch(e){throw new Error("Não consegui falar com o servidor (rede ou CORS).");}
  const txt=await r.text();
  let j={};try{j=JSON.parse(txt);}catch(_){}
  if(!r.ok)throw new Error(`Erro ${r.status}: ${j.error||txt.slice(0,150)||"sem resposta"}`);
  return j;
}

async function abrir(card,g){
  const p=card.querySelector(".pn");p.hidden=!p.hidden;
  if(p.hidden||p.dataset.busy)return;
  const sj=(estado.get(g.id)||{}).status;
  if(AOVIVO.has(sj)||sj==="HT"||FINAIS.has(sj))return aoVivo(p,g);
  p.dataset.busy="1";p.innerHTML='<div class="ms">Calculando estatísticas reais…</div>';
  const vs=escopo==="split"?["home","away"]:["all","all"];
  try{
    for(let i=0;i<80;i++){
      const [a,b]=await Promise.all([[g.home,vs[0]],[g.away,vs[1]]].map(([t,v])=>buscar(t.id,v)));
      pintar(p,g,a,b);
      if(!(a.pending||b.pending))break;
      await new Promise(r=>setTimeout(r,2500));
    }
  }catch(e){p.innerHTML=`<div class="ms">${esc(e.message)}</div>`;}
  delete p.dataset.busy;
}

const ROT=[["Posse de bola","Ball Possession"],["Finalizações","Total Shots"],["Chutes a gol","Shots on Goal"],["Chutes para fora","Shots off Goal"],
["Chutes bloqueados","Blocked Shots"],["Escanteios","Corner Kicks"],["Impedimentos","Offsides"],["Faltas","Fouls"],["Cartões amarelos","Yellow Cards"],
["Cartões vermelhos","Red Cards"],["Defesas do goleiro","Goalkeeper Saves"],["Passes","Total passes"],["Passes certos","Passes accurate"],
["Precisão de passes","Passes %"],["Gols esperados (xG)","expected_goals"]];
async function aoVivo(p,g){
  p.dataset.busy="1";p.innerHTML='<div class="ms">Buscando estatísticas do jogo…</div>';
  try{
    do{
      let r;try{r=await fetch(`${API}/match/${g.id}`);}catch(_){throw new Error("Não consegui falar com o servidor (rede ou CORS).");}
      const j=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(j.error||`Erro ${r.status} ao buscar estatísticas do jogo (rota não encontrada ou servidor caiu)`);
      pintarJogo(p,g,j.stats||{});
      const st=(estado.get(g.id)||{}).status;
      if(!(AOVIVO.has(st)||st==="HT"))break;
      await new Promise(x=>setTimeout(x,60000));
    }while(!p.hidden);
  }catch(e){p.innerHTML=`<div class="ms">${esc(e.message)}</div>`;}
  delete p.dataset.busy;
}
function pintarJogo(p,g,s){
  const a=s[g.home.id]||{},b=s[g.away.id]||{},e=estado.get(g.id)||{},viva=AOVIVO.has(e.status)||e.status==="HT";
  const n=v=>v==null?0:parseFloat(String(v).replace("%",""))||0,sh=v=>v==null?"0":String(v).replace(".",",");
  let h=`<div class="cab"><span style="color:var(--cy)">${esc(g.home.name)}</span><span class="${viva?"vm":"t"}">${viva?"ESTATÍSTICAS AO VIVO":"ESTATÍSTICAS DO JOGO"}</span><span style="color:var(--rs)">${esc(g.away.name)}</span></div>`;
  let achou=false;
  ROT.forEach(([rot,k])=>{
    if(a[k]===undefined&&b[k]===undefined)return;achou=true;
    const x=n(a[k]),y=n(b[k]),m=Math.max(x,y)||1;
    h+=`<div class="ln"><b>${sh(a[k])}</b><div class="bk l"><i style="width:${x/m*100}%;background:var(--cy)"></i></div><span class="c">${rot}</span><div class="bk"><i style="width:${y/m*100}%;background:var(--rs)"></i></div><b>${sh(b[k])}</b></div>`;
  });
  if(!achou)h+='<div class="ms">A API ainda não tem estatísticas deste jogo.</div>';
  else if(viva)h+='<p class="t" style="margin-top:12px">Atualiza a cada 60 segundos enquanto o jogo está rolando.</p>';
  p.innerHTML=h;
}
function pintar(p,g,a,b){
  const lb=escopo==="split"?[" (em casa)"," (fora)"]:["",""];
  let h=`<div class="bar">${Object.entries(MEDIDAS).map(([k,l])=>`<button class="med${k===medida?" on":""}" data-m="${k}">${l}</button>`).join("")}<span class="sp"></span><span class="t">${a.games}/${a.total} e ${b.games}/${b.total} jogos${a.pending||b.pending?" · registrando…":""}</span></div>
  <div class="cab"><span style="color:var(--cy)">${esc(g.home.name)}${lb[0]}</span><span style="color:var(--rs)">${esc(g.away.name)}${lb[1]}</span></div>`;
  GRUPOS.forEach(([nome,linhas])=>{
    h+=`<div class="g">${nome.toUpperCase()}</div>`;
    linhas.forEach(([rot,k])=>{
      const x=a.stats[k]?.[medida],y=b.stats[k]?.[medida],m=Math.max(x||0,y||0)||1;
      h+=`<div class="ln"><b>${fmt(x)}</b><div class="bk l"><i style="width:${(x||0)/m*100}%;background:var(--cy)"></i></div><span class="c">${rot}</span><div class="bk"><i style="width:${(y||0)/m*100}%;background:var(--rs)"></i></div><b>${fmt(y)}</b></div>`;
    });
  });
  h+='<p class="t" style="margin-top:12px">Moda "—": nenhum valor se repetiu nos jogos registrados.</p>';
  p.innerHTML=h;
  p.querySelectorAll(".med").forEach(x=>x.onclick=()=>{medida=x.dataset.m;pintar(p,g,a,b);});
}

let estado=new Map();
const AOVIVO=new Set(["1H","2H","ET","BT","P","LIVE","INT"]),FINAIS=new Set(["FT","AET","PEN"]);
function linha(g){
  const e=estado.get(g.id)||{},gl=e.goals||{},pl=`${gl.home??0} – ${gl.away??0}`;
  if(AOVIVO.has(e.status)){const m=e.elapsed!=null?e.elapsed+Math.floor((Date.now()-e.t0)/60000):null;
    const tp={"1H":" • 1º TEMPO","2H":" • 2º TEMPO","ET":" • PRORROGAÇÃO","P":" • PÊNALTIS"}[e.status]||"";
    return [`<b class="vm">AO VIVO${tp}${m!=null?" • "+m+"'":""}</b>`,`<b class="vm">${pl}</b>`];}
  if(e.status==="HT")return [`<b class="vm">INTERVALO</b>`,`<b class="vm">${pl}</b>`];
  if(FINAIS.has(e.status))return [e.fim&&Date.now()-e.fim<300000?"FINALIZADO":esc(g._t),`<b>${pl}</b>`];
  return [esc(g._t),"x"];
}
function atualizar(id){
  const g=porId.get(id),c=document.querySelector(`.card[data-id="${id}"]`);if(!g||!c)return;
  const [a,b]=linha(g);c.querySelector(".t").innerHTML=a;c.querySelector(".x").innerHTML=b;
}
async function fechar(id){
  try{const f=(await (await fetch(`${API}/fixture/${id}`)).json()).data;
    if(f)estado.set(id,{status:f.status,elapsed:f.elapsed,goals:f.goals||{},t0:Date.now(),fim:FINAIS.has(f.status)?Date.now():null});}catch(_){}
}
async function pollLive(){
  if(document.hidden||periodo==="tomorrow")return;
  try{
    const j=await (await fetch(`${API}/live`)).json();if(!j.data)return;
    const vivos=new Set(j.data.map(f=>f.id));
    j.data.forEach(f=>{if(estado.has(f.id))estado.set(f.id,{status:f.status,elapsed:f.elapsed,goals:f.goals||{},t0:Date.now(),fim:null});});
    for(const [id,e] of [...estado])if((AOVIVO.has(e.status)||e.status==="HT")&&!vivos.has(id))await fechar(id);
    estado.forEach((_,id)=>atualizar(id));
  }catch(_){}
}
setInterval(pollLive,60000);
setInterval(()=>estado.forEach((e,id)=>{if(e.status!=="NS")atualizar(id);}),30000);
$("#lista").onclick=e=>{const r=e.target.closest(".row");if(r)abrir(r.parentElement,porId.get(+r.parentElement.dataset.id));};
document.querySelectorAll(".per").forEach(b=>b.onclick=()=>{periodo=b.dataset.p;carregar();});
document.querySelectorAll(".esc").forEach(b=>b.onclick=()=>{escopo=b.dataset.e;desenhar();});
$("#liga").onchange=desenhar;
carregar();
</script>
